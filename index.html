<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>收藏庫</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#E8825A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    :root {
      --bg: #fbf6f0; --card: #ffffff; --ink: #3a2a20; --sub: #9a8578;
      --line: #efe4d8; --accent: #E8825A; --accent-ink: #c9552e; --warn: #b98900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: "Noto Sans TC", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: calc(16px + env(safe-area-inset-top)) 18px 10px; }
    .header h1 { font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
    .header .count { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .content { padding: 6px 14px 48px; }

    /* 目錄首頁 */
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 6px; }
    .coll-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 16px; cursor: pointer; transition: transform .08s; min-height: 116px; display: flex; flex-direction: column; justify-content: space-between; }
    .coll-card:active { transform: scale(.97); }
    .coll-card .emoji { font-size: 34px; line-height: 1; }
    .coll-card .name { font-size: 17px; font-weight: 800; margin-top: 12px; }
    .coll-card .n { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .coll-card.empty { opacity: .6; }

    /* 搜尋 + 分類卡片 */
    .search { padding: 6px 4px 8px; }
    .search input { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 14px; font-size: 15px; font-family: inherit; color: var(--ink); outline: none; }
    .search input:focus { border-color: var(--accent); }
    .group-label { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 6px 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px; margin-bottom: 11px; cursor: pointer; transition: transform .08s; }
    .card:active { transform: scale(.985); }
    .card .name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .card .summary { font-size: 13px; color: var(--sub); margin-top: 5px; line-height: 1.45; }
    .card .meta { font-size: 11px; color: var(--sub); margin-top: 8px; display: flex; gap: 8px; align-items: center; }
    .tag { background: #fdeee6; color: var(--accent-ink); border-radius: 6px; padding: 2px 7px; font-weight: 700; }
    .empty-msg { text-align: center; color: var(--sub); padding: 56px 24px; font-size: 14px; line-height: 1.7; }

    /* 返回列 */
    .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; }
    .back { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; width: 38px; height: 38px; font-size: 20px; cursor: pointer; color: var(--ink); flex: 0 0 auto; line-height: 1; }
    .bar .t { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 詳情 markdown */
    .md { padding: 8px 18px 60px; line-height: 1.65; }
    .md h1 { font-size: 21px; font-weight: 900; margin: 4px 0 4px; letter-spacing: -.02em; }
    .md .src { font-size: 12px; color: var(--sub); margin-top: 20px; }
    .md h2 { font-size: 15px; font-weight: 800; margin: 22px 0 8px; color: var(--accent-ink); border-left: 3px solid var(--accent); padding-left: 8px; }
    .md ul, .md ol { margin: 0 0 4px; padding-left: 6px; list-style: none; }
    .md li { font-size: 15px; padding: 7px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
    .md li .b { color: var(--accent); font-weight: 800; flex: 0 0 auto; min-width: 16px; }
    .md li > span:last-child { flex: 1; min-width: 0; word-break: break-word; }
    .md blockquote { background: #fff8e6; border-left: 3px solid var(--warn); color: #6b5410; font-size: 13.5px; border-radius: 8px; padding: 10px 12px; margin: 14px 0; line-height: 1.55; }
    .md blockquote.note { background: #fff; border-left-color: var(--accent); color: var(--sub); }
    .md p { font-size: 15px; margin: 8px 0; }
    .md strong { font-weight: 800; }
  </style>
</head>
<body>
  <div id="app"><div class="empty-msg">載入中…</div></div>

  <script>
    let DATA = { collections: [] };

    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    // 極簡 markdown → HTML
    function renderMd(md) {
      const lines = md.split('\n');
      let html = '', listType = null;
      const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };
      const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      for (let raw of lines) {
        const line = raw.trimEnd();
        if (line === '') { closeList(); continue; }
        let m;
        if ((m = line.match(/^#\s+(.+)/))) { closeList(); html += `<h1>${inline(m[1])}</h1>`; }
        else if ((m = line.match(/^##\s+(.+)/))) { closeList(); html += `<h2>${inline(m[1])}</h2>`; }
        else if ((m = line.match(/^###\s+(.+)/))) { closeList(); html += `<h2>${inline(m[1])}</h2>`; }
        else if ((m = line.match(/^>\s?(.*)/))) { closeList(); const warn = /⚠️/.test(m[1]); html += `<blockquote class="${warn ? '' : 'note'}">${inline(m[1])}</blockquote>`; }
        else if ((m = line.match(/^(\d+)\.\s+(.+)/))) { if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; } html += `<li><span class="b">${m[1]}</span><span>${inline(m[2])}</span></li>`; }
        else if ((m = line.match(/^[-*]\s+(.+)/))) { if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; } html += `<li><span class="b">·</span><span>${inline(m[1])}</span></li>`; }
        else { closeList(); html += `<p>${inline(line)}</p>`; }
      }
      closeList();
      return html;
    }

    const coll = id => DATA.collections.find(c => c.id === id);
    const item = (c, iid) => c && c.items.find(x => x.id === iid);

    // ===== 三個畫面 =====
    function viewHome() {
      const total = DATA.collections.reduce((s, c) => s + c.count, 0);
      let cards = DATA.collections.map(c =>
        `<div class="coll-card ${c.count ? '' : 'empty'}" data-c="${esc(c.id)}">
          <div class="emoji">${c.emoji}</div>
          <div><div class="name">${esc(c.id)}</div><div class="n">${c.count} 則</div></div>
        </div>`).join('');
      return `<div class="header"><h1>📚 收藏庫</h1><div class="count">共 ${total} 則・${DATA.collections.length} 個主題</div></div>
        <div class="content"><div class="home-grid">${cards}</div></div>`;
    }

    function viewCollection(cid, query) {
      const c = coll(cid);
      if (!c) return viewHome();
      const q = (query || '').trim().toLowerCase();
      const list = c.items.filter(it => !q || (it.name + it.summary + it.body).toLowerCase().includes(q));
      let body;
      if (!c.items.length) {
        body = `<div class="empty-msg">這個主題還沒有內容 🕊️<br>把相關的圖片傳進 LINE,<br>再跟 Claude 說「處理收件匣」就會進來。</div>`;
      } else if (!list.length) {
        body = `<div class="empty-msg">找不到符合的內容</div>`;
      } else {
        const groups = {};
        list.forEach(it => (groups[it.sub] = groups[it.sub] || []).push(it));
        body = Object.keys(groups).map(sub =>
          `<div class="group-label">${esc(sub)}</div>` +
          groups[sub].map(it =>
            `<div class="card" data-i="${esc(it.id)}">
              <div class="name">${esc(it.name)}</div>
              ${it.summary ? `<div class="summary">${esc(it.summary)}</div>` : ''}
              <div class="meta"><span class="tag">${esc(it.sub)}</span>${it.source ? `<span>${esc(it.source)}</span>` : ''}</div>
            </div>`).join('')).join('');
      }
      const searchBox = c.items.length ? `<div class="search"><input id="q" type="search" placeholder="在「${esc(c.id)}」裡搜尋…" autocomplete="off" value="${esc(query || '')}"></div>` : '';
      return `<div class="bar"><button class="back" data-back="home">‹</button><div class="t">${c.emoji} ${esc(c.id)}</div></div>
        <div class="content">${searchBox}${body}</div>`;
    }

    function viewDetail(cid, iid) {
      const c = coll(cid); const it = item(c, iid);
      if (!it) return viewCollection(cid, '');
      return `<div class="bar"><button class="back" data-back="c/${esc(cid)}">‹</button><div class="t">${esc(it.name)}</div></div>
        <div class="md">${renderMd(it.body)}${it.source ? `<div class="src">來源:${esc(it.source)}</div>` : ''}</div>`;
    }

    // ===== 路由 =====
    function render() {
      const app = document.getElementById('app');
      const h = location.hash.replace(/^#/, '');
      let html, scroll = true;
      let m;
      if ((m = h.match(/^i\/([^/]+)\/(.+)$/))) html = viewDetail(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
      else if ((m = h.match(/^c\/(.+)$/))) html = viewCollection(decodeURIComponent(m[1]), sessionQuery);
      else html = viewHome();
      app.innerHTML = html;

      app.querySelectorAll('.coll-card').forEach(el => el.onclick = () => { sessionQuery = ''; location.hash = 'c/' + encodeURIComponent(el.dataset.c); });
      app.querySelectorAll('.card').forEach(el => el.onclick = () => {
        const cid = (location.hash.match(/^#c\/(.+)$/) || [])[1];
        location.hash = 'i/' + cid + '/' + encodeURIComponent(el.dataset.i);
      });
      app.querySelectorAll('.back').forEach(el => el.onclick = () => { sessionQuery = ''; location.hash = el.dataset.back === 'home' ? '' : el.dataset.back; });
      const qi = document.getElementById('q');
      if (qi) qi.oninput = e => { sessionQuery = e.target.value; const c = (location.hash.match(/^#c\/(.+)$/) || [])[1]; renderListOnly(decodeURIComponent(c), sessionQuery); };
      if (scroll) window.scrollTo(0, 0);
    }
    let sessionQuery = '';

    // 搜尋時只重繪清單，不動輸入框（保留游標）
    function renderListOnly(cid, query) {
      const c = coll(cid); if (!c) return;
      const content = document.querySelector('.content'); if (!content) return;
      const q = query.trim().toLowerCase();
      const list = c.items.filter(it => !q || (it.name + it.summary + it.body).toLowerCase().includes(q));
      const old = content.querySelector('.group-label, .empty-msg');
      // 移除舊清單（保留 search）
      Array.from(content.children).forEach(ch => { if (!ch.classList.contains('search')) ch.remove(); });
      if (!list.length) { content.insertAdjacentHTML('beforeend', `<div class="empty-msg">找不到符合的內容</div>`); return; }
      const groups = {};
      list.forEach(it => (groups[it.sub] = groups[it.sub] || []).push(it));
      const html = Object.keys(groups).map(sub =>
        `<div class="group-label">${esc(sub)}</div>` +
        groups[sub].map(it =>
          `<div class="card" data-i="${esc(it.id)}">
            <div class="name">${esc(it.name)}</div>
            ${it.summary ? `<div class="summary">${esc(it.summary)}</div>` : ''}
            <div class="meta"><span class="tag">${esc(it.sub)}</span>${it.source ? `<span>${esc(it.source)}</span>` : ''}</div>
          </div>`).join('')).join('');
      content.insertAdjacentHTML('beforeend', html);
      content.querySelectorAll('.card').forEach(el => el.onclick = () => { location.hash = 'i/' + encodeURIComponent(cid) + '/' + encodeURIComponent(el.dataset.i); });
    }

    window.addEventListener('hashchange', render);

    fetch('data.json?v=' + Date.now())
      .then(r => r.json())
      .then(d => { DATA = d; render(); })
      .catch(e => { document.getElementById('app').innerHTML = '<div class="empty-msg">載入失敗:' + e.message + '</div>'; });
  </script>
</body>
</html>
