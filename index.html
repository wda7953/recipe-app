<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>食譜</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#E8825A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    :root {
      --bg: #fbf6f0; --card: #ffffff; --ink: #3a2a20; --sub: #9a8578;
      --line: #efe4d8; --accent: #E8825A; --accent-ink: #c9552e; --warn: #b98900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: "Noto Sans TC", system-ui, sans-serif; background: var(--bg); color: var(--ink);
           -webkit-font-smoothing: antialiased; }
    .header { position: sticky; top: 0; z-index: 10; background: var(--bg);
              padding: calc(14px + env(safe-area-inset-top)) 18px 8px; }
    .header h1 { font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
    .header .count { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .search { padding: 6px 18px 8px; position: sticky; top: 0; background: var(--bg); }
    .search input { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
                    padding: 11px 14px; font-size: 15px; font-family: inherit; color: var(--ink); outline: none; }
    .search input:focus { border-color: var(--accent); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border: 1.5px solid var(--line); background: #fff; color: var(--sub);
            border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .content { padding: 4px 14px 40px; }
    .group-label { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 6px 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px;
            margin-bottom: 11px; cursor: pointer; transition: transform .08s; }
    .card:active { transform: scale(.985); }
    .card .name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .card .summary { font-size: 13px; color: var(--sub); margin-top: 5px; line-height: 1.45; }
    .card .meta { font-size: 11px; color: var(--sub); margin-top: 8px; display: flex; gap: 8px; align-items: center; }
    .tag { background: #fdeee6; color: var(--accent-ink); border-radius: 6px; padding: 2px 7px; font-weight: 700; }
    .empty { text-align: center; color: var(--sub); padding: 60px 20px; font-size: 14px; }

    /* 詳情覆蓋層 */
    .detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
              transform: translateX(100%); transition: transform .22s ease; }
    .detail.open { transform: translateX(0); }
    .detail .bar { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; gap: 10px;
                   padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
    .back { border: none; background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
            width: 38px; height: 38px; font-size: 18px; cursor: pointer; color: var(--ink); flex: 0 0 auto; }
    .detail .bar .t { font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .md { padding: 16px 18px 60px; line-height: 1.65; }
    .md h1 { font-size: 21px; font-weight: 900; margin: 4px 0 4px; letter-spacing: -.02em; }
    .md .src { font-size: 12px; color: var(--sub); margin-bottom: 14px; }
    .md h2 { font-size: 15px; font-weight: 800; margin: 22px 0 8px; color: var(--accent-ink);
             border-left: 3px solid var(--accent); padding-left: 8px; }
    .md ul, .md ol { margin: 0 0 4px; padding-left: 6px; list-style: none; }
    .md li { font-size: 15px; padding: 7px 0 7px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
    .md li .b { color: var(--accent); font-weight: 800; flex: 0 0 auto; min-width: 16px; }
    .md li > span:last-child { flex: 1; min-width: 0; word-break: break-word; }
    .md blockquote { background: #fff8e6; border-left: 3px solid var(--warn); color: #6b5410;
                     font-size: 13.5px; border-radius: 8px; padding: 10px 12px; margin: 14px 0; line-height: 1.55; }
    .md blockquote.note { background: #fff; border-left-color: var(--accent); color: var(--sub); }
    .md p { font-size: 15px; margin: 8px 0; }
    .md strong { font-weight: 800; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍳 食譜</h1>
    <div class="count" id="count"></div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="搜尋菜名、食材…（例：檸檬、豆腐）" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="content" id="content"><div class="empty">載入中…</div></div>

  <div class="detail" id="detail">
    <div class="bar"><button class="back" id="back">‹</button><div class="t" id="dtitle"></div></div>
    <div class="md" id="dbody"></div>
  </div>

  <script>
    let RECIPES = [];
    let activeCat = '全部';
    let query = '';

    // 極簡 markdown → HTML（只處理本 App 用到的語法：# ## - 1. > ** ）
    function renderMd(md) {
      const lines = md.split('\n');
      let html = '', listType = null;
      const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };
      const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      for (let raw of lines) {
        const line = raw.trimEnd();
        if (line === '') { closeList(); continue; }
        let m;
        if ((m = line.match(/^#\s+(.+)/))) { closeList(); html += `<h1>${inline(m[1])}</h1>`; }
        else if ((m = line.match(/^##\s+(.+)/))) { closeList(); html += `<h2>${inline(m[1])}</h2>`; }
        else if ((m = line.match(/^>\s?(.*)/))) {
          closeList();
          const warn = /⚠️/.test(m[1]);
          html += `<blockquote class="${warn ? '' : 'note'}">${inline(m[1])}</blockquote>`;
        }
        else if ((m = line.match(/^(\d+)\.\s+(.+)/))) {
          if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
          html += `<li><span class="b">${m[1]}</span><span>${inline(m[2])}</span></li>`;
        }
        else if ((m = line.match(/^[-*]\s+(.+)/))) {
          if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
          html += `<li><span class="b">·</span><span>${inline(m[1])}</span></li>`;
        }
        else { closeList(); html += `<p>${inline(line)}</p>`; }
      }
      closeList();
      return html;
    }
    function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    function categories() {
      const set = [...new Set(RECIPES.map(r => r.category))];
      return ['全部', ...set];
    }
    function filtered() {
      const q = query.trim().toLowerCase();
      return RECIPES.filter(r => {
        if (activeCat !== '全部' && r.category !== activeCat) return false;
        if (!q) return true;
        return (r.name + r.summary + r.body).toLowerCase().includes(q);
      });
    }

    function renderChips() {
      document.getElementById('chips').innerHTML = categories().map(c =>
        `<div class="chip ${c === activeCat ? 'active' : ''}" data-c="${esc(c)}">${esc(c)}</div>`).join('');
      document.querySelectorAll('.chip').forEach(el =>
        el.onclick = () => { activeCat = el.dataset.c; renderChips(); renderList(); });
    }

    function renderList() {
      const list = filtered();
      const el = document.getElementById('content');
      document.getElementById('count').textContent = `共 ${RECIPES.length} 則`;
      if (!list.length) { el.innerHTML = '<div class="empty">找不到符合的食譜</div>'; return; }
      // 依分類分組顯示
      const groups = {};
      list.forEach(r => (groups[r.category] = groups[r.category] || []).push(r));
      let html = '';
      for (const cat of Object.keys(groups)) {
        if (activeCat === '全部') html += `<div class="group-label">${esc(cat)}</div>`;
        for (const r of groups[cat]) {
          html += `<div class="card" data-id="${esc(r.id)}">
            <div class="name">${esc(r.name)}</div>
            ${r.summary ? `<div class="summary">${esc(r.summary)}</div>` : ''}
            <div class="meta"><span class="tag">${esc(r.category)}</span>${r.source ? `<span>${esc(r.source)}</span>` : ''}</div>
          </div>`;
        }
      }
      el.innerHTML = html;
      el.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id));
    }

    function openDetail(id) {
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      document.getElementById('dtitle').textContent = r.name;
      document.getElementById('dbody').innerHTML =
        renderMd(r.body) + (r.source ? `<div class="src" style="margin-top:20px">來源：${esc(r.source)}</div>` : '');
      document.getElementById('detail').classList.add('open');
      location.hash = 'r/' + encodeURIComponent(id);
    }
    function closeDetail() {
      document.getElementById('detail').classList.remove('open');
      if (location.hash) history.back();
    }
    document.getElementById('back').onclick = closeDetail;
    window.addEventListener('hashchange', () => {
      if (!location.hash) document.getElementById('detail').classList.remove('open');
    });

    document.getElementById('q').addEventListener('input', e => { query = e.target.value; renderList(); });

    fetch('recipes.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        RECIPES = data.recipes || [];
        renderChips(); renderList();
        // 支援直接開啟某道食譜的連結
        const m = location.hash.match(/^#r\/(.+)/);
        if (m) openDetail(decodeURIComponent(m[1]));
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<div class="empty">載入失敗：' + e.message + '</div>';
      });
  </script>
</body>
</html>
